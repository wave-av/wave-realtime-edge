name: deploy

# wave-realtime-edge deploy (#30). workflow_dispatch ONLY — never auto-deploy on push.
# Merges to main do NOT deploy; Jake names the crossing explicitly (proven-live-or-not-done +
# every-product-host-on-chassis: rt.wave.online is a paid customer-facing host). Mirrors the
# established sibling pattern (wave-acuity-edge/.github/workflows/deploy.yml).
#
# What this does:
#   1. .npmrc + npm ci || npm install   (#258 added the private @wave-av/spoke-chassis dep, so this
#      needs GitHub Packages auth — packages:read + NODE_AUTH_TOKEN + .npmrc, mirroring contract-tests.yml)
#   2. typecheck + test (re-run the gate before a real deploy)
#   3. deploy guard — refuse to deploy a commit no longer reachable from the dispatched ref's tip
#   4. wrangler deploy --var GIT_SHA:<sha> — stamps the exact commit into the running Worker
#      wrangler reads wrangler.toml: name, main, routes (rt.wave.online custom_domain), the Durable Object
#      bindings + migrations — ROOM/v1, RECORDER, and AGENT_SESSION (voice-agent runtime, migration v3,
#      new_sqlite_classes ["AgentSessionDO"]) — vars, and observability. First deploy bootstraps the migrations.
#   5. post-deploy verify — polls the live /health for production only (canary has no custom-domain
#      host per wrangler.toml's ROUTE ISOLATION comment; see scripts/ci/resolve-deploy-host.mjs) until
#      it echoes this run's sha, proving the RIGHT bundle answered, not just that the API call succeeded.
#
# ── Deploy-ordering guarantee (go-live remediation, 2026-09-02 — /health was reporting a stale
# "version":"dev" with no way to prove which commit was actually live) ─────────────────────────────
#   This repo is workflow_dispatch-ONLY by design (never push-triggered — see header above), so the
#   "three PRs merged in 20s" race the sibling spokes guard against cannot happen the same way here;
#   `concurrency.group` below still serializes any overlapping manual dispatches (queues, never kills
#   an in-flight deploy), the deploy-guard step is belt-and-suspenders against a stale ref, and the
#   post-deploy verify step is the actual proof — mirrors wave-spoke-template's proven deploy.yml.
#
# Secrets required in this repo (set once, NOT here — same org secrets the other spokes use):
#   CLOUDFLARE_API_TOKEN   — CF API token: Workers Scripts:Edit, Workers KV:Edit, Zone Workers Routes:Edit
#   CLOUDFLARE_ACCOUNT_ID  — the WAVE CF account id
#
# Worker runtime secrets are NOT set here — and NOT from this PUBLIC repo's CI (GitHub won't expose the org
# DOPPLER_TOKEN to a public repo, and prod creds must never live here). Provision them from the PRIVATE
# foundation hub: run wave-av/wave-foundation `provision-worker-secrets.yml` (workflow_dispatch) with
# worker=wave-realtime-edge and secret_names="WAVE_SERVICE_TOKEN ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID
# CF_CALLS_APP_ID CF_CALLS_APP_SECRET" — values flow Doppler -> foundation CI -> Cloudflare. They include:
#   CF_CALLS_APP_ID, CF_CALLS_APP_SECRET   — CF Realtime SFU app creds (sfu.ts)
#   WAVE_SERVICE_TOKEN                     — gateway bearer: metering tap (room.ts) AND, via
#                                            normalizeGatewayEnv, the voice-agent LLM/STT/tools paths
#   ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID — voice-agent TTS (agent-turn.ts), behind VOICE_AGENT_PROVIDER
#   WAVE_INTERNAL_SECRET, CF_API_TOKEN, TURN_KEY_ID, TURN_KEY_TOKEN — existing /rtk surface (worker.ts)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "which env to deploy (production = rt.wave.online; canary = wave-realtime-edge-canary on workers.dev)"
        type: choice
        options:
          - production
          - canary
        default: production

permissions:
  contents: read
  packages: read # @wave-av/spoke-chassis is a private GitHub Packages dep (added in #258)

concurrency:
  group: deploy-wave-realtime-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (not the default shallow depth-1) — required by the "deploy guard" step's
          # `git merge-base --is-ancestor` check below.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # #258 added @wave-av/spoke-chassis (private scope). Without a .npmrc pointing the @wave-av scope at
      # GitHub Packages with a read token, `npm ci` 401s and the deploy never runs. Mirrors the proven
      # pattern in contract-tests.yml / governance-enforce.yml. NODE_AUTH_TOKEN is substituted by npm at read time.
      - name: Authenticate to GitHub Packages for the @wave-av scope
        run: printf '@wave-av:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc

      - name: install
        run: npm ci || npm install

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: test (vitest)
        run: npm test

      # Belt-and-suspenders against a stale/orphaned dispatch: refuses to deploy a commit that is no
      # longer (or never was) reachable from the tip of the dispatched ref — e.g. a force-push/rebase
      # moved the branch out from under an in-flight run. Mirrors wave-spoke-template's deploy guard.
      - name: deploy guard — commit must be reachable from the dispatched ref's tip
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          git fetch origin "$REF_NAME" --quiet
          TIP=$(git rev-parse "origin/$REF_NAME")
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$REF_NAME"; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of origin/$REF_NAME (tip $TIP) — a newer commit has superseded this run; refusing to deploy a stale/orphaned commit"
            exit 1
          fi
          echo "deploy guard OK: $GITHUB_SHA is an ancestor of origin/$REF_NAME (tip $TIP)"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # production → default worker (wrangler.toml top-level: name=wave-realtime-edge, rt.wave.online
          # custom_domain, ROOM/RECORDER/AGENT_SESSION DOs). canary → the [env.canary] worker
          # (wave-realtime-edge-canary, workers_dev, routes=[] so it CANNOT inherit/steal the prod custom
          # domain, RT_ENCODER=container + AV1_DEFAULT + NEGOTIATION_ENABLED for the #138 recorder proof).
          # `environment` is a restricted choice input (production|canary) — no injection surface.
          # GIT_SHA is stamped as a plain (non-secret) var override at deploy time — no wrangler.toml
          # edit needed per deploy. /health echoes it back (both `version` and `sha`) so the next step
          # can prove THIS commit, not just A commit, is what answers live traffic.
          command: ${{ inputs.environment == 'canary' && format('deploy --env canary --var GIT_SHA:{0}', github.sha) || format('deploy --var GIT_SHA:{0}', github.sha) }}

      # Proven-live gate (proven-live-or-not-done): a green `wrangler deploy` only proves the API call
      # succeeded, not that the right bundle is answering live traffic. This step is the receipt.
      # production resolves to rt.wave.online (wrangler.toml's TOP-LEVEL routes key — this repo has no
      # [env.production] block, see scripts/ci/resolve-deploy-host.mjs). canary is skipped by design:
      # [env.canary] deliberately sets `routes = []` (incident 2026-07-12 — ROUTE ISOLATION comment in
      # wrangler.toml), so it has no custom-domain host to poll.
      - name: post-deploy verify — proven live, not merely deployed
        env:
          TARGET_ENV: ${{ inputs.environment }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -e
          HOST=$(node scripts/ci/resolve-deploy-host.mjs "$TARGET_ENV" || true)
          if [ -z "$HOST" ]; then
            echo "::notice::no live custom-domain route for env '$TARGET_ENV' in wrangler.toml — skipping live verification (expected for canary, see wrangler.toml ROUTE ISOLATION comment)"
            exit 0
          fi

          echo "Verifying https://$HOST/health reports sha == $EXPECT_SHA (timeout 120s)..."
          DEADLINE=$((SECONDS + 120))
          LIVE_SHA=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            LIVE_SHA=$(curl -fsS --max-time 10 "https://$HOST/health" 2>/dev/null \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).sha||"")}catch{process.stdout.write("")}})' \
              || echo "")
            if [ "$LIVE_SHA" = "$EXPECT_SHA" ]; then
              echo "receipt: https://$HOST/health sha=$LIVE_SHA matches $EXPECT_SHA"
              break
            fi
            sleep 5
          done
          if [ "$LIVE_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::post-deploy verification FAILED after 120s — https://$HOST/health reports sha='$LIVE_SHA', expected '$EXPECT_SHA'. A stale or wrong bundle may be live."
            exit 1
          fi
