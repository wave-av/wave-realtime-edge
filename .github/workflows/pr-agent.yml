# pr-agent (OSS) — INLINED job (not a wave-foundation reusable call).
#
# WHY INLINED: this repo is PUBLIC; wave-av/wave-foundation is PRIVATE. GitHub Actions does
# NOT permit a public repo to consume a private repo's reusable workflow even with org-level
# access — the call fails in 0s with 0 jobs (workflow_run never starts). Same constraint as
# foundation-gate.yml. Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent).
# Keep in sync with SSOT: wave-foundation/.github/workflows/reusable-pr-agent.yml
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          pr_code_suggestions.commitable_code_suggestions: "true"
