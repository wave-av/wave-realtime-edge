name: contract-tests

# Runs the worker contract test suite on every PR and on pushes to master/staging.
# Tests import the fetch handler directly (no network, no Cloudflare runtime needed)
# so the job is hermetic and fast.

on:
  pull_request:
  push:
    branches: [main, master, staging]

permissions:
  contents: read
  packages: read # @wave-av/spoke-chassis is a private GitHub Packages dep (added in #258)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Worker contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      # #258 added @wave-av/spoke-chassis (private scope). Without a .npmrc pointing the @wave-av scope at
      # GitHub Packages with a read token, `npm ci` 401s and this whole test gate silently stopped running.
      # Mirrors the proven pattern in governance-enforce.yml. NODE_AUTH_TOKEN is substituted by npm at read time.
      - name: Authenticate to GitHub Packages for the @wave-av scope
        run: printf '@wave-av:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run contract tests
        # --coverage (see vitest.config.ts) writes ./coverage/lcov.info. Same suite, same
        # assertions — the flag only adds the V8 report.
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is a REPO-level Actions secret holding this repo's Codecov *upload* token.
        # Codecov issues two non-interchangeable credentials: the org API/read token authenticates
        # api.codecov.io, while only the per-repo upload token is accepted here. Least privilege —
        # a leak of this value only lets someone post coverage to this one repo.
        #
        # fail_ci_if_error: true is deliberate. The previous fleet-wide Codecov attempt used
        # `false` everywhere, which turned every rejected upload into a silent no-op and is the
        # direct reason nothing was ever ingested across 135 repos. Loud beats invisible.
        #
        # if: always() so coverage still uploads when a test fails — a failing PR is exactly when
        # the coverage delta is most worth seeing.
        #
        # This repo is PUBLIC, so the guard also skips fork PRs: GitHub withholds secrets from a
        # fork's run, which would leave `token` empty and — with fail_ci_if_error true — fail every
        # external contributor's PR on a step they cannot possibly satisfy. Coverage for the merge
        # commit is still recorded by the push-to-main run. (These are `if:` expressions evaluated
        # by the Actions expression engine, never interpolated into a shell.)
        #
        # disable_search: true + an explicit `files:` keeps the uploader from walking the tree —
        # this job writes a .npmrc containing a GitHub Packages token, and it must never be swept
        # into an upload.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: worker
          name: wave-realtime-edge-worker
          disable_search: true
          fail_ci_if_error: true

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      # See "test" job above: @wave-av/spoke-chassis is a private GitHub Packages dep (#258).
      - name: Authenticate to GitHub Packages for the @wave-av scope
        run: printf '@wave-av:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc

      - name: Install dependencies
        run: npm ci || npm install

      # #302: tsc only ran in deploy.yml, so a red `npm run typecheck` merged and made main
      # un-deployable. This job closes that gap by running the same check on every PR.
      - name: Run typecheck
        run: npm run typecheck
